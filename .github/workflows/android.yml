name: Build offline Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_model:
        description: "Download Qwen3-4B Q4_K_M as a separate model artifact (about 2.5 GB)"
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout app
        uses: actions/checkout@v5
      - name: Checkout llama.cpp native inference engine
        uses: actions/checkout@v5
        with:
          repository: ggml-org/llama.cpp
          ref: master
          path: external/llama.cpp
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install native build tools
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests and build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: screenwriter-offline-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  model:
    if: (github.event_name == 'workflow_dispatch' && inputs.include_model) || (github.event_name == 'push' && contains(github.event.head_commit.message, 'Download Qwen model artifact once'))
    runs-on: ubuntu-24.04
    steps:
      - name: Download Qwen3-4B Q4_K_M GGUF
        run: curl --fail --location --retry 5 --retry-all-errors --output Qwen3-4B-Q4_K_M.gguf https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf
      - name: Verify GGUF header
        run: test "$(head -c 4 Qwen3-4B-Q4_K_M.gguf)" = "GGUF"
      - name: Upload model as a separate artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-4b-q4-k-m-gguf
          path: Qwen3-4B-Q4_K_M.gguf
          if-no-files-found: error
          retention-days: 7
